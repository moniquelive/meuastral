name = "meuastral"
main = "worker/index.js"
compatibility_date = "2025-07-31"
workers_dev = true

[[durable_objects.bindings]]
name = "HOROSCOPE_CACHE"
class_name = "DailyHoroscopeCache"

[[migrations]]
tag = "v1-horoscope-cache"
new_sqlite_classes = ["DailyHoroscopeCache"]

[assets]
directory = "build"
binding = "STATIC_CONTENT"
run_worker_first = [
  "/",
  "/*/",
  "/en",
  "/api/horoscope",
]

[build]
command = "bash build.sh"
